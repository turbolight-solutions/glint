[package]
name = "glint-wasm"
version = "0.1.0"
description = "Glint for the browser: checks, corpus queries and completion over the published data"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
