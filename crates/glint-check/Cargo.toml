[package]
name = "glint-check"
version = "0.1.0"
description = "Check pipeline, configuration and rule set for Glint"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
glint-syntax = { workspace = true }
glint-extract = { workspace = true }
glint-corpus = { workspace = true }
glint-sema = { workspace = true }
glint-diag = { workspace = true }
toml = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
reqwest = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }

[features]
# Tests that download documents from the RFC Editor.
net-tests = ["dep:reqwest", "dep:sha2"]

[lints]
workspace = true

[dev-dependencies]
insta = { workspace = true }
