glint-corpus = { workspace = true }
glint-diag = { workspace = true }
glint-sema = { workspace = true }
clap = { workspace = true }
rayon = { workspace = true }
regex = { workspace = true }
reqwest = { workspace = true }
sha2 = { workspace = true }
quick-xml = { workspace = true }
toml = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[lints]
workspace = true

[[bin]]
name = "corpus-build"
path = "src/main.rs"

[dev-dependencies]
glint-check = { workspace = true }
