name: release

# A release is code only: the CLI binaries and the site (index.html, the scripts and glint.wasm). The data is built
# and published every day by data.yml.

# Make the release on GitHub (with its tag); publishing it runs this workflow, which attaches the files to it.

on:
  release:
    types: [published]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  binaries:
    name: binary (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-22.04, archive: tar.gz }
          - { target: aarch64-apple-darwin, os: macos-14, archive: tar.gz }
          - { target: x86_64-pc-windows-msvc, os: windows-latest, archive: zip }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked --target ${{ matrix.target }} -p glint-asn1
      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          out="target/${{ matrix.target }}/release"
          mkdir dist
          bin=glint
          [ "${{ matrix.archive }}" = zip ] && bin=glint.exe
          cp "$out/$bin" LICENSE NOTICE dist/
          name="glint-${{ matrix.target }}.${{ matrix.archive }}"
          if [ "${{ matrix.archive }}" = zip ]; then
            (cd dist && 7z a "../$name" "$bin" LICENSE NOTICE >/dev/null)
          else
            tar -czf "$name" -C dist "$bin" LICENSE NOTICE
          fi
          if command -v sha256sum >/dev/null; then sha256sum "$name" > "$name.sha256"; else shasum -a 256 "$name" > "$name.sha256"; fi
          "dist/$bin" --version
          "dist/$bin" explain E110 | head -n 3
          # Glint carries no data; without any it must say how to get some.
          ("dist/$bin" corpus list 2>&1 || true) | grep -q "glint corpus update"
      - uses: actions/upload-artifact@v7
        with:
          name: glint-${{ matrix.target }}
          path: |
            glint-${{ matrix.target }}.${{ matrix.archive }}
            glint-${{ matrix.target }}.${{ matrix.archive }}.sha256

  site:
    name: site (code zip)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Install wasm-bindgen (the version Cargo.lock pins)
        run: |
          version="$(cargo metadata --format-version 1 --locked | jq -r '.packages[] | select(.name == "wasm-bindgen") | .version')"
          cargo install wasm-bindgen-cli --version "$version" --locked
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: sudo apt-get update && sudo apt-get install -y brotli
      - name: Build
        working-directory: web
        run: npm ci && npm run build && npm test
      - name: Package
        run: |
          set -euo pipefail
          name="glint-site-${GITHUB_REF_NAME}"
          deploy/precompress.sh web/dist
          (cd web/dist && zip -qr "../../$name.zip" .)
          sha256sum "$name.zip" > "$name.zip.sha256"
      - uses: actions/upload-artifact@v7
        with:
          name: glint-site
          path: |
            glint-site-*.zip
            glint-site-*.zip.sha256

  publish:
    name: GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [binaries, site]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true
      - name: Attach the files to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.ref_name }}" --repo "${{ github.repository }}" --clobber artifacts/glint-*

  deploy:
    name: deploy the site
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [site]
    runs-on: ubuntu-latest
    environment: glint-site
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: glint-site
      - name: Publish to the site
        env:
          DEPLOY_TARGET: ${{ secrets.GLINT_DEPLOY_TARGET }}
          SSH_KEY: ${{ secrets.GLINT_DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.GLINT_DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          if [ -z "$DEPLOY_TARGET" ]; then echo "::notice::No deploy target configured; the site is only an artifact"; exit 0; fi
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          mkdir site && unzip -q "glint-site-${{ github.ref_name }}.zip" -d site
          deploy/deploy.sh code site "${{ github.ref_name }}"
