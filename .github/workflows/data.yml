name: data

# Builds the corpus data every day from the RFC Editor and IETF mirrors and publishes it to the Glint site on GitHub
# Pages, with the site of the latest release. The data is versioned on its own (data/v<schema>/<build>/) and never
# carried by the code; only the latest build is published.

on:
  schedule:
    - cron: "23 5 * * *"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

concurrency:
  group: data
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.build.outputs.build }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: corpus/fetch.sh
      - name: Build the data
        id: build
        run: |
          set -euo pipefail
          cargo run --release --locked -p glint-corpus-build -- \
            --rfc-dir corpus/cache/rfc --drafts-dir corpus/cache/drafts --overrides corpus/overrides --errata-dir corpus/errata \
            --sources corpus/sources.toml --errata corpus/cache/errata.json --iana corpus/cache/smi-numbers.xml \
            --out corpus/out
          build="$(jq -r .build corpus/out/data/v*/latest.json)"
          echo "build=$build" >> "$GITHUB_OUTPUT"
          (cd corpus/out && zip -qr "../../glint-data-$build.zip" data)
      - name: Compare the example artifacts with corpus/artifacts.expected
        # A difference is a decoder fix (update the file) or a decoder regression; it never holds up the data. New RFCs
        # with PEM examples add lines too.
        run: |
          if ! diff -u corpus/artifacts.expected corpus/out/artifacts.expected > artifacts.diff; then
            echo "::warning::The RFC example artifacts differ from corpus/artifacts.expected; see the artifacts-diff artifact"
            cat artifacts.diff
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: artifacts-diff
          path: artifacts.diff
          if-no-files-found: ignore
      - name: List the errata waiting on a person
        run: |
          set -euo pipefail
          cargo run --release --locked -q -p glint-asn1 -- errata \
            --corpus corpus/out/data/v*/"${{ steps.build.outputs.build }}"/corpus.json queue | tee errata-queue.txt
      - uses: actions/upload-artifact@v7
        with:
          name: errata-queue
          path: errata-queue.txt
      - uses: actions/upload-artifact@v7
        with:
          name: glint-data-${{ steps.build.outputs.build }}
          path: |
            glint-data-${{ steps.build.outputs.build }}.zip
            corpus/out/report.md
            corpus/out/artifacts.expected

  errata-issue:
    # Opens, updates or closes the "RFC errata awaiting triage" issue; never holds up the data.
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: errata-queue
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: .github/errata-issue.sh errata-queue.txt "${{ needs.build.outputs.build }}"

  publish:
    needs: build
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
    with:
      data-artifact: glint-data-${{ needs.build.outputs.build }}
