user www-data;
worker_processes auto;
pid /run/nginx.pid;
error_log /var/log/nginx/error.log;
include /etc/nginx/modules-enabled/*.conf;

events {
        worker_connections 768;
        # multi_accept on;
}

http {
        ##
        # Basic Settings
        ##
        sendfile on;
        tcp_nopush on;
        types_hash_max_size 2048;
        server_tokens off;
        # server_names_hash_bucket_size 64;
        # server_name_in_redirect off;

        include /etc/nginx/mime.types;
        default_type application/octet-stream;

        ##
        # SSL Settings
        ##
        ssl_protocols TLSv1.2 TLSv1.3; # Dropping SSLv3/TLSv1/TLSv1.1
        ssl_prefer_server_ciphers on;

        ##
        # Logging Settings
        ##
        access_log /var/log/nginx/access.log;

        ##
        # Gzip Settings
        ##
        # The Glint site is precompressed (gzip_static below); this covers everything else.
        gzip on;
        # gzip_vary on;
        # gzip_proxied any;
        # gzip_comp_level 6;
        # gzip_buffers 16 8k;
        # gzip_http_version 1.1;
        # gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

        ##
        # Virtual Host Configs
        ##
        include /etc/nginx/conf.d/*.conf;
        include /etc/nginx/sites-enabled/*;

        # Caching of the Glint site. Hashed assets (Vite output, glint.wasm) and the files of a data build never
        # change once published; the page and the pointer to the current data build change with every deploy.
        map $uri $glint_cache_control {
                default                         "no-cache";
                ~^/assets/                      "public, max-age=31536000, immutable";
                ~^/data/v[0-9]+/latest\.json$   "no-cache";
                ~^/data/v[0-9]+/[^/]+/          "public, max-age=31536000, immutable";
        }

        # The Glint site: static files only. Code releases live in /var/www/glint/releases/<version>, with
        # /var/www/glint/current pointing at the live one (switched with `ln -sfn`); the data builds live in
        # /var/www/glint/data, which code releases leave alone, so pinned and in-flight builds stay available.
        server {
                listen 127.0.0.1:10443 ssl;
                listen [::1]:10443 ssl;
                server_name glint.turbolightsolutions.com;

                ssl_certificate     /etc/nginx/ssl/fullchain.pem;
                ssl_certificate_key /etc/nginx/ssl/privkey.pem;
                ssl_protocols       TLSv1.2 TLSv1.3;
                ssl_ciphers         HIGH:!aNULL:!MD5;

                root /var/www/glint/current;
                index index.html;

                # The page loads Bootstrap from jsDelivr (pinned, with integrity hashes) and nothing else from
                # outside. CodeMirror adds <style> elements at run time, hence 'unsafe-inline' for styles only;
                # compiling glint.wasm needs 'wasm-unsafe-eval'. Every response, error pages included, gets them.
                add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; font-src 'self' https://cdn.jsdelivr.net; img-src 'self' data:; connect-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
                add_header X-Content-Type-Options "nosniff" always;
                add_header Referrer-Policy "no-referrer" always;
                add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
                add_header Cache-Control $glint_cache_control always;

                # Serve the .gz (and .br, with ngx_brotli) files that CI writes beside each file.
                gzip_static on;
                # brotli_static on;

                location ~ \.wasm$ {
                        types { application/wasm wasm; }
                }

                location /data/ {
                        root /var/www/glint;
                        types {
                                application/json json;
                                application/octet-stream bin;
                                text/plain sha256;
                        }
                }

                # The page routes with the URL hash, so a path that is not a file is a 404, not the page.
                location / {
                        try_files $uri $uri/ =404;
                }
        }
}

stream {
    map $ssl_preread_alpn_protocols $backend {
        "acme-tls/1"  127.0.0.1:10043;
        default        127.0.0.1:10443;
    }
    server {
        listen 443;
        listen [::]:443;
        ssl_preread on;
        proxy_pass $backend;
    }
}
