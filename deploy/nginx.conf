user www-data;
worker_processes auto;
pid /run/nginx.pid;
error_log /var/log/nginx/error.log;
include /etc/nginx/modules-enabled/*.conf;

events {
        worker_connections 768;
        # multi_accept on;
}

http {
        ##
        # Basic Settings
        ##
        sendfile on;
        tcp_nopush on;
        types_hash_max_size 2048;
        server_tokens off;
        # server_names_hash_bucket_size 64;
        # server_name_in_redirect off;

        include /etc/nginx/mime.types;
        default_type application/octet-stream;

        ##
        # SSL Settings
        ##
        ssl_protocols TLSv1.2 TLSv1.3; # Dropping SSLv3/TLSv1/TLSv1.1
        ssl_prefer_server_ciphers on;

        ##
        # Logging Settings
        ##
        access_log /var/log/nginx/access.log;

        ##
        # Gzip Settings
        ##
        # glint-server already gzips its responses when the client accepts it.
        gzip on;
        # gzip_vary on;
        # gzip_proxied any;
        # gzip_comp_level 6;
        # gzip_buffers 16 8k;
        # gzip_http_version 1.1;
        # gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

        ##
        # Rate Limiting
        ##
        limit_req_zone $binary_remote_addr zone=glint:10m rate=10r/s;

        ##
        # Virtual Host Configs
        ##
        include /etc/nginx/conf.d/*.conf;
        include /etc/nginx/sites-enabled/*;

        server {
                listen 127.0.0.1:10443 ssl;
                listen [::1]:10443 ssl;
                server_name glint.turbolightsolutions.com;

                ssl_certificate     /etc/nginx/ssl/fullchain.pem;
                ssl_certificate_key /etc/nginx/ssl/privkey.pem;
                ssl_protocols       TLSv1.2 TLSv1.3;
                ssl_ciphers         HIGH:!aNULL:!MD5;

                # Request size cap: glint-server rejects bodies over GLINT_MAX_BODY (5 MiB by default),
                # so stop slightly above that and let the app give the proper error.
                client_max_body_size 6m;

                # glint-server sets Content-Security-Policy, X-Content-Type-Options and Referrer-Policy
                # itself; adding them here would send them twice.
                add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

                location / {
                        limit_req zone=glint burst=20 nodelay;

                        # The glint container, published on loopback only:
                        #   docker run -d -p 127.0.0.1:8080:8080 -e GLINT_TRUST_PROXY=true glint
                        proxy_pass http://127.0.0.1:8080;
                        proxy_http_version 1.1;
                        proxy_set_header Host              $host;
                        proxy_set_header X-Real-IP         $remote_addr;
                        proxy_set_header X-Forwarded-For   $remote_addr;
                        proxy_set_header X-Forwarded-Proto https;
                        proxy_redirect off;

                        # Timeouts to bound slow upstream/clients. The app's own request timeout is
                        # 30 s (GLINT_REQUEST_TIMEOUT_SECS), so leave it room to answer first.
                        proxy_connect_timeout 5s;
                        proxy_send_timeout    35s;
                        proxy_read_timeout    35s;
                }
        }
}

stream {
    map $ssl_preread_alpn_protocols $backend {
        "acme-tls/1"  127.0.0.1:10043;
        default        127.0.0.1:10443;
    }
    server {
        listen 443;
        listen [::]:443;
        ssl_preread on;
        proxy_pass $backend;
    }
}
