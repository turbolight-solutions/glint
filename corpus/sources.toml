# Standalone ASN.1 modules that the corpus bundles besides the ones extracted from RFCs: modules that standards
# bodies publish as files of their own (ITU-T Recommendations, ETSI specifications, ...). A new body or document
# needs entries here and nothing else. The files are never committed.
#
# A `[[body]]` names a standards body and carries the notice that credits it in the bundle. The notice ships when
# the bundle holds a module of the body.
#
# A `[[module]]` is one downloadable module. `document` is the specification it is published in (`X.509`) and
# `edition` its edition, as the body dates it: ITU-T's approval date as `MM/YYYY`, followed by any corrigendum or
# amendment the file includes (`07/1994, Cor. 1 07/1995`); ISO's year of publication. The module's `oid` is its
# definitive identifier and identifies the entry: editions of a specification reuse the module name and change the
# OID, so list each edition you want as its own entry. A module whose header gives no OID (X.680 13.1 allows that)
# is listed without `oid` and identified by `document` and `name`; only imports that give no OID take it.
# `url` must give the module itself (ITU-T's .asn files, not their HTML renderings): a download that is not a module
# whose identifier is that `oid` (without `oid`: a module of that name with no OID) fails the build, as does one
# that fails.
#
# `include` says when the module is bundled:
#   "when-imported" (default)  only when some corpus module imports it and nothing in the corpus satisfies the
#                              import. An import that gives an OID takes the entry with that OID; an import
#                              without one takes the entries of that name while the corpus has no module of the name.
#   "always"                   in every build.

[[body]]
id = "itu-t"
notice = "Modules from ITU-T Recommendations are the property of ITU-T and are included with credit to ITU-T."

[[body]]
id = "iso"
notice = "Modules from ISO and ISO/IEC International Standards are the property of ISO and IEC and are included with credit to ISO and IEC, with the copyright notices they are published with."

